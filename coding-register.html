
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMU Coding Challenge | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="event-register-page coding-page">

    <main class="event-registration-wrapper">


        <section class="event-hero">
            <p class="event-eyebrow">BMU TECH CLUB PRESENTS</p>

            <h1>BMU Coding Challenge</h1>

            <div class="event-details">
    <p><strong>Date:</strong> 30 September</p>
    <p><strong>Time:</strong> 3 PM to 5 PM</p>
    <p><strong>Venue:</strong> NB 105</p>
</div>
        </section>

        <section class="event-form-card">

            <div class="form-heading">
                <h2>Your Next Challenge Starts Here!</h2>
                <p>
                    Enter your details:
                </p>
            </div>

            <form id="codingChallengeForm"
                  data-event-form="coding-challenge">

                <div class="form-group">
                    <label for="codingFullName">Full Name</label>
                    <input
                        type="text"
                        id="codingFullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="codingEnrollment">Enrollment Number</label>
                    <input
                        type="text"
                        id="codingEnrollment"
                        name="enrollmentNumber"
                        placeholder="Enter your enrollment number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="codingEmail">Email Address</label>
                    <input
                        type="email"
                        id="codingEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="codingPhone">Phone Number</label>
                    <input
                        type="tel"
                        id="codingPhone"
                        name="phoneNumber"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="codingCourse">Course</label>
                    <select
                        id="codingCourse"
                        name="course"
                        required
                    >
                        <option value="">Select your course</option>
                        <option value="CSE">Computer Science</option>
                        <option value="ECE">Electronics and Communication</option>
                        <option value="ME">Mechanical Engineering</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" id="codingSubmitButton">
                    Register Now
                </button>

                <p class="form-note">
                    Please check your details before submitting.
                </p>

                <p id="codingFormMessage"
                   role="status"
                   aria-live="polite"></p>

            </form>
        </section>

        <footer class="event-footer">
            <p>BMU Tech Club | Learn. Create. Innovate.</p>
        </footer>

    </main>

</body>
</html>
